# PR-Agent: AI review of same-repository pull requests via NVIDIA NIM (Kimi K3).
# NVIDIA deprecated its free Kimi K3 hosted endpoint (as of 2026-11-15).
# This job is intentionally disabled until the model endpoint is verified working.
# To enable after verification: add NVIDIA_NIM_API_KEY as an Actions secret, then
# set Actions repository variable PR_AGENT_NVIDIA_ENABLED=true.
name: PR Agent (NVIDIA Kimi K3)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Review changed code
    if: >-
      ${{ vars.PR_AGENT_NVIDIA_ENABLED == 'true' &&
          github.event.sender.type != 'Bot' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check NVIDIA API key
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          if [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo "::error::Configure NVIDIA_NIM_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Review pull request with PR-Agent
        # The-PR-Agent/pr-agent v0.50.0 (immutable commit pin)
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          config.model: "nvidia_nim/moonshotai/kimi-k3"
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "128000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          pr_reviewer.num_max_findings: "5"
          pr_reviewer.extra_instructions: "Review this repository only. Prioritize authentication, authorization, secret handling, IMAP/SMTP safety, SQLite migrations, and regressions in the changed code. Avoid unrelated refactoring."
